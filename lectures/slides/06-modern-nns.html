<li>
<p>And so on, until we reach the first layer.</p>
</li>
<li>
<p>We are <strong>recursively</strong> applying the chain rule and re-using the gradients computed at the previous layer</p>
</li>
<li>
<p>This is great for computational efficiency, but it can also lead to <strong>vanishing</strong> or <strong>exploding gradients</strong></p>
</li>
</ul>

<h2 id="vanishing-and-exploding-gradients">Vanishing and Exploding Gradients</h2>
<ul>
<li><strong>Vanishing/exploding gradients</strong> are where the gradients become near zero or near infinity as they are propagated back through the network</li>
<li>Particularly problematic for <strong>recurrent</strong> neural networks, where the same weights are multiplied by themselves repeatedly</li>
<li>Also a problem for very deep networks, and part of the reason that deep learning was not popular until the 2010s</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> What changed?</li>
</ul>
</section>

<h2 id="batch-normalization">Batch normalization</h2>

<ul>
<li>Also in 2015, <a href="https://arxiv.org/abs/1502.03167">Ioffe and Szegedy</a> proposed <strong>batch normalization</strong> as a way to mitigate vanishing/exploding gradients</li>
<li>This is simply a normalization <strong>at each layer</strong>, shifting and scaling the inputs to have a mean of 0 and a variance of 1 (across the batch)</li>
<li>A <strong>moving average</strong> of the mean and variance is maintained <strong>during training</strong>, and used for normalization during inference</li>
<li>It also ends up acting as <strong>regularization</strong>, magic!</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> Why wouldn't you want to use batch normalization?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="sv8kc3zpc77tf73remu3k821r70wkzlm418z9psd00ze" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:sv8kc3zpc77tf73remu3k821r70wkzlm418z9psd00ze;" data-marpit-pagination-total="14">
<h2 id="relu-and-its-variants">RELU and its variants</h2>
<ul>
<li>In early works, the sigmoid or tanh functions were popular</li>
<li>Both have a small range of non-zero gradients</li>
<li>ReLU has a stable gradient for positive inputs, but can lead to the <strong>dying ReLU</strong> problem whereby certain neurons are &quot;turned off&quot;</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> How can we prevent dying ReLUs?</li>
</ul>
<div data-marpit-fragment>
<blockquote>
<p>Note: this may not be a problem, and ReLU is cheap. Don't optimize prematurely unless you're seeing lots of &quot;dead&quot; neurons.</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="sv8kc3zpc77tf73remu3k821r70wkzlm418z9psd00ze" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:sv8kc3zpc77tf73remu3k821r70wkzlm418z9psd00ze;" data-marpit-pagination-total="14">
<h2 id="number-of-neurons-and-layers">Number of neurons and layers</h2>
<ul>
<li>Number of neurons in the <strong>input layer</strong> is defined by number of features</li>
<li>Number of neurons in the <strong>output layer</strong> is defined by prediction task</li>
<li>In between is a <strong>design choice</strong></li>
<li>Common early choice was a pyramid shape, but it turns out that a stack of layers with the same number of neurons works well too</li>
<li>Deeper networks can solve more complex problems with the same number of total parameters, but are also prone to vanishing/exploding gradients</li>
</ul>
<blockquote>
<p>Ultimately, yet another a hyperparameter to be tuned</p>
</blockquote>
</section>

<h2 id="regularization-via-dropout">Regularization via dropout</h2>
<ul>
<li><strong>Dropout</strong> is a regularization technique that randomly sets a fraction of the neurons to zero during training</li>
<li>During each training pass, a neuron has a <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="1.138ex" height="1.439ex" role="img" focusable="false" viewBox="0 -442 503 636"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45D" d="M23 287Q24 290 25 295T30 317T40 348T55 381T75 411T101 433T134 442Q209 442 230 378L240 387Q302 442 358 442Q423 442 460 395T497 281Q497 173 421 82T249 -10Q227 -10 210 -4Q199 1 187 11T168 28L161 36Q160 35 139 -51T118 -138Q118 -144 126 -145T163 -148H188Q194 -155 194 -157T191 -175Q188 -187 185 -190T172 -194Q170 -194 161 -194T127 -193T65 -192Q-5 -192 -24 -194H-32Q-39 -187 -39 -183Q-37 -156 -26 -148H-6Q28 -147 33 -136Q36 -130 94 103T155 350Q156 355 156 364Q156 405 131 405Q109 405 94 377T71 316T59 280Q57 278 43 278H29Q23 284 23 287ZM178 102Q200 26 252 26Q282 26 310 49T356 107Q374 141 392 215T411 325V331Q411 405 350 405Q339 405 328 402T306 393T286 380T269 365T254 350T243 336T235 326L232 322Q232 321 229 308T218 264T204 212Q178 106 178 102Z"></path></g></g></g></svg></mjx-container> probability of being dropped</li>
<li>Similar to training an ensemble of models then bagging</li>
<li>Helps to prevent overfitting, but can slow down training</li>
<li>Typical values: 0.5 for hidden layers, 0.2 for input layers</li>
</ul>
</section>

<h2 id="choices-for-starting">Choices for starting</h2>
<p>From the Deep Learning Book, section 11.2:</p>
<ul>
<li>&quot;Depending on the complexity of your problem, you may even want to begin without using deep learning.&quot;</li>
<li>Tabular data: fully connected, images: convolutional, sequences: recurrent*</li>
<li>ReLU or variants, with He initialization</li>
<li>SGD or Adam, add batch normalization if unstable</li>
<li>Use some kind of regularization, such as dropout</li>
</ul>
<footer>*This book was written before transformer models</footer>
</section>
